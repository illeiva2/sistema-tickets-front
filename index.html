<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6c53cf" />

    <!-- iOS: "Agregar a inicio" queda a pantalla completa (sin la UI de Safari)
         y con nombre/ícono propios. Safari no lee bien el manifest para esto
         todavía, por eso las meta tags con prefijo apple- son necesarias
         además del manifest.webmanifest que ya inyecta vite-plugin-pwa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Soporte GRF" />
    <title>Soporte GRF · Sistema de Tickets</title>
    <meta
      name="description"
      content="Mesa de ayuda interna de GRF: tickets de soporte, recursos, novedades y gestión IT."
    />

    <!-- Open Graph / WhatsApp / Facebook / Slack. og:image necesita URL
         ABSOLUTA (WhatsApp no resuelve rutas relativas) y conviene 1200x630
         para la tarjeta grande con foto en vez del thumbnail chico. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soporte GRF" />
    <meta property="og:url" content="https://soporte.grf.com.ar/" />
    <meta property="og:title" content="Soporte GRF · Sistema de Tickets" />
    <meta
      property="og:description"
      content="Mesa de ayuda interna de GRF: tickets de soporte, recursos, novedades y gestión IT."
    />
    <meta property="og:image" content="https://soporte.grf.com.ar/og-image.png" />
    <meta property="og:image:secure_url" content="https://soporte.grf.com.ar/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soporte GRF — Sistema de tickets internos" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Card: algunos previsualizadores (Slack incluido) lo usan
         como respaldo si no encuentran las tags og:. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soporte GRF · Sistema de Tickets" />
    <meta
      name="twitter:description"
      content="Mesa de ayuda interna de GRF: tickets de soporte, recursos, novedades y gestión IT."
    />
    <meta name="twitter:image" content="https://soporte.grf.com.ar/og-image.png" />

    <!-- Fuentes para los themes (Quiet Pro: Inter; Workshop: Plus Jakarta + Fraunces; Dystopia: IBM Plex Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Anti-flash: aplica el theme y modo guardados antes de que cargue React -->
    <script>
      (function () {
        try {
          var themes = ["quiet-pro", "workshop", "dystopia"];
          var t = localStorage.getItem("ui:theme");
          if (themes.indexOf(t) === -1) t = "quiet-pro";
          var m = localStorage.getItem("ui:dark");
          document.documentElement.setAttribute("data-theme", t);
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark =
            m === "1" || m === "true" || m === "dark" ||
            ((m === null || m === undefined) && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
